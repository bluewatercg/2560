services:
  web:
    image: strategy2560:latest
    container_name: strategy2560-web
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro
  worker:
    image: strategy2560:latest
    container_name: strategy2560-worker
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
      - WEB_BASE_URL=http://web:8000
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "scripts/job_worker.py"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      - web
