services:
  web:
    image: strategy2560:latest
    container_name: strategy2560-web
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-192.168.1.30}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-strategy2560}
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro

  # ── 数据准备 worker（导入 / 30m / 指标） ──
  worker-data:
    image: strategy2560:latest
    container_name: strategy2560-worker-data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
      - WEB_BASE_URL=http://web:8000
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-192.168.1.30}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-strategy2560}
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "scripts/job_worker.py"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      - web

  # ── 2560 市场 lane worker ──
  worker-sh60:
