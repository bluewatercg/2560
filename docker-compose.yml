services:
  web:
    image: strategy2560:latest
    container_name: strategy2560-web
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro

  # ── 数据准备 worker（导入 / 30m / 指标） ──
  worker-data:
    image: strategy2560:latest
    container_name: strategy2560-worker-data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
      - WEB_BASE_URL=http://web:8000
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "scripts/job_worker.py"]
    restart: unless-stopped
    depends_on:
      - web

  # ── 2560 市场 lane worker ──
  worker-sh60:
    image: strategy2560:latest
    container_name: strategy2560-worker-sh60
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - VIPDOC_ROOT=/data/vipdoc
      - WEB_BASE_URL=http://web:8000
      - WORKER_MARKET=sh60
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      - ./zd_ciccwm/vipdoc:/data/vipdoc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "scripts/job_worker.py"]
    restart: unless-stopped
    depends_on:
      - web

