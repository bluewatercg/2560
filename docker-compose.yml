services:
  web:
    image: strategy2560:latest
    container_name: strategy2560-web
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      # 如果服务器有行情数据目录，按实际路径打开：
      # - /data/zd_ciccwm/vipdoc:/data/vipdoc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: strategy2560:latest
    container_name: strategy2560-worker
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./sql:/app/sql
      # 如果 worker 需要行情数据目录，按实际路径打开：
      # - /data/zd_ciccwm/vipdoc:/data/vipdoc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "scripts/job_worker.py"]
    restart: unless-stopped
    depends_on:
      - web
